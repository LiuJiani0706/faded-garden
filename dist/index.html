<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一瓶一色</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#293c38;font-family:system-ui;text-align:center}main{max-width:680px;margin:auto;padding:36px 20px}small{letter-spacing:4px;color:#788c81}h1{font-size:42px;margin:14px}p{color:#677b70}button,select{font:inherit;padding:12px 18px;border:1px solid #b9cbbf;border-radius:14px;background:#fff;color:#293c38;cursor:pointer}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}#board{display:flex;flex-wrap:wrap;gap:25px;justify-content:center;padding:55px 5px;min-height:260px}.bottle{width:65px;height:172px;border:3px solid #8fa99e;border-top:0;border-radius:6px 6px 22px 22px;display:flex;flex-direction:column-reverse;padding:4px;position:relative;background:#ffffff60;transition:transform .2s}.bottle.active{transform:translateY(-18px);outline:3px solid #315d50}.bottle.hint{outline:3px dashed #d69b35}.water{height:25%;flex-shrink:0;width:100%;display:flex;align-items:center;justify-content:center;color:#fff9;font-size:12px}.water:first-child{border-radius:0 0 15px 15px}#message{min-height:40px;font-weight:600}footer{margin-top:30px;font-size:13px;color:#829187}#board{display:grid;grid-template-columns:repeat(3,65px);gap:30px 42px;min-height:0;padding:32px 0;justify-content:center}.bottle{height:132px;box-shadow:0 5px 0 #cad8ce,inset 4px 0 0 #ffffff90;touch-action:manipulation}.bottle.active{transform:translateY(-12px);animation:bob 1s ease-in-out infinite}.bottle.complete{border-color:#4aaf76;box-shadow:0 5px 0 #a5d5af}.bottle.complete:after{content:'✓';position:absolute;top:-22px;left:21px;color:#379a62;font-weight:bold}.bottle:active,nav button:active{transform:translateY(4px);box-shadow:none}nav button,#next{border-bottom:5px solid #b9cbbf;font-weight:700}#next{background:#70c268;color:white}button:disabled{opacity:.45;cursor:default}.water{transition:height .3s;background-image:linear-gradient(110deg,#ffffff30,transparent)}#message{background:#e4ede2;border-radius:14px;padding:12px;min-height:48px}main{padding-top:18px}h1{font-size:34px}main>p{font-size:14px}.confetti{position:fixed;top:-20px;width:9px;height:16px;z-index:99;animation:fall 1.6s ease-in forwards;pointer-events:none}@keyframes bob{50%{translate:0 -5px}}@keyframes flow{from{scale:0 1}50%{scale:1 1}to{scale:0 1}}@keyframes fall{to{transform:translateY(100vh) rotate(600deg);opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-height:760px){.bottle{height:106px}#board{gap:26px 40px;padding:24px 0}main>p{margin:9px}h1{margin:8px}}.progress-wrap{max-width:320px;margin:14px auto 0;text-align:left;font-size:13px;color:#577462}progress{display:block;width:100%;height:12px;margin-top:7px;accent-color:#66b966}.bottle.available{border-color:#75b889;box-shadow:0 0 0 4px #b9e5b955,0 5px 0 #a1c8a9}.bottle.wrong{animation:shake .25s ease}.bottle.land .water{animation:squish .35s ease}.bottle.received{box-shadow:0 0 0 5px #b2dfcb}.bottle.new-complete{animation:pop .55s ease;box-shadow:0 0 0 7px #b9e5b9}.bottle{ -webkit-tap-highlight-color:transparent}button:focus-visible,select:focus-visible{outline:3px solid #416e9b;outline-offset:5px}@keyframes shake{25%{translate:-5px}75%{translate:5px}}@keyframes squish{50%{scale:1.08 .88}}@keyframes pop{40%{transform:translateY(-12px) scale(1.12)}75%{transform:scale(.96)}}@media(prefers-reduced-motion:reduce){.bottle,.water,.confetti{animation:none!important;transition:none!important}}#story{background:#fffdf5;border:1px solid #ddd7b6;border-radius:18px;padding:14px 20px;margin:14px auto;text-align:left;max-width:450px;box-shadow:0 4px 0 #e3ddc5}#story h2{margin:0 0 8px;font-size:18px}#story p{margin:0;line-height:1.7;font-size:14px}#garden{display:flex;justify-content:center;gap:8px;margin:12px}.flower{font-size:25px;filter:grayscale(1);opacity:.3;transition:filter .5s,opacity .5s,transform .5s}.flower.restored{filter:none;opacity:1;transform:translateY(-3px)}.scores{background:#fff;border:1px solid #d1ddcf;border-radius:18px;padding:18px;text-align:left;margin:24px auto;max-width:450px}.scores h2{font-size:20px;margin:0}.scores h2 small{font-size:12px;letter-spacing:0}.scores p{font-size:12px;line-height:1.6}.scores label{display:block;font-size:13px;margin:10px 0}.scores input[type=text],#player{border:1px solid #ccd9cc;border-radius:8px;padding:8px;width:130px}.scores li{padding:9px 3px;border-bottom:1px solid #eef1ea;font-size:14px}.scores li strong{float:right;color:#458258}</style><main><small>WATER SORT · FADED GARDEN · 60 LEVELS</small><h1>失色花园</h1><p>点选一只瓶子，再点另一只。把每种颜色归到同一瓶。</p><section id="story" aria-live="polite"></section><div id="garden" aria-label="花园修复进度"></div><nav><select id="level" aria-label="选择关卡"></select><button id="undo">撤销</button><button id="reset">重来</button><button id="hint">提示</button><button id="sound" aria-pressed="false">声音：关</button></nav><p id="stats"></p><div class="progress-wrap"><label id="progress-label" for="progress"></label><progress id="progress" max="7" value="0"></progress></div><div id="board"></div><div id="message" aria-live="polite"></div><button id="next" hidden>下一关 →</button><section class="scores"><h2>花园手记</h2><p id="collection"></p><button id="export-save">导出存档</button> <label>导入存档 <input id="import-save" type="file" accept="application/json"></label><p id="save-status" role="status">进度自动保存在当前浏览器；清理浏览器前请导出备份。</p></section><footer>空瓶可以接水；有水的瓶子只能接同色。进度自动保存在本机。支持的设备会提供轻微震动。</footer></main><script src="core.js"></script><script src="app.js"></script></html>
